# SPDX-License-Identifier: Apache-2.0
#
# Build luci-app-picoclaw IPK using plain bash + tar (no SDK, no Docker).
#
# The package is architecture-independent (pure Lua + init shell script +
# placeholder launcher), so we ship a single `Architecture: all` IPK
# rather than running the full OpenWrt SDK. This trades off:
#     - we don't validate the Makefile against a real buildroot, but
#     - we don't need to pull ~600 MB of Docker image per matrix entry,
#       and there's no per-arch image-availability problem.
#
# Layout (must exist under files/):
#   files/etc/config/picoclaw
#   files/etc/init.d/picoclaw-webui               (executable in package)
#   files/usr/libexec/picoclaw-launcher-placeholder (executable in package)
#   files/usr/lib/lua/luci/picoclaw.lua           (in-process backend)
#   files/usr/lib/lua/luci/controller/picoclaw.lua
#   files/usr/lib/lua/luci/model/cbi/picoclaw_config.lua
#   files/usr/lib/lua/luci/view/picoclaw/status.htm
#   files/usr/lib/lua/luci/view/picoclaw/logs.htm
#   files/usr/share/rpcd/ucode/luci.picoclaw.uc   (rpcd ucode plugin)
#   files/usr/share/rpcd/acl.d/40-picoclaw.json

name: Build IPK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate sources
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== shell syntax ====="
          for f in files/etc/init.d/picoclaw-webui files/usr/libexec/picoclaw-launcher-placeholder; do
            sh -n "$f"
            echo "[OK] $f"
          done

          echo
          echo "===== lua syntax ====="
          LUAC="$(command -v luac5.1 || command -v luac5.3 || command -v luac || true)"
          if [ -n "$LUAC" ]; then
            while IFS= read -r f; do
              "$LUAC" -p "$f"
              echo "[OK] $f"
            done < <(find files -name '*.lua' | sort)
          else
            echo "::warning::no luac available, skipping Lua syntax check"
          fi

          echo
          echo "===== ucode plugin sanity ====="
          # rpcd runs whatever ucode version the platform ships.  The
          # constructs below are NOT valid ucode (there is no `typeof`
          # operator and for-in loops need `let`) and silently keep the
          # plugin from being registered - see git history.
          UC="files/usr/share/rpcd/ucode/luci.picoclaw.uc"
          if grep -nE 'typeof[[:space:]]' "$UC"; then
            echo "::error::$UC uses the non-existent ucode 'typeof' operator (use type())"
            exit 1
          fi
          if grep -nE 'for[[:space:]]*\([[:space:]]*const[[:space:]]' "$UC"; then
            echo "::error::$UC uses 'for (const ...)' which ucode rejects (use let)"
            exit 1
          fi
          echo "[OK] $UC"

      - name: Build architecture-independent IPK
        shell: bash
        run: |
          set -Eeuo pipefail

          PKG="luci-app-picoclaw"
          VERSION="1.0.0"
          RELEASE="11"

          WORK="$RUNNER_TEMP/ipk"
          OUT="$GITHUB_WORKSPACE/dist"
          IPK="$OUT/${PKG}_${VERSION}-${RELEASE}_all.ipk"

          echo "======================================"
          echo "Building $PKG"
          echo "Version: ${VERSION}-${RELEASE}"
          echo "Architecture: all"
          echo "======================================"

          # ------------------------------------------------------------
          # Locate source files
          # ------------------------------------------------------------

          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            SRC="$GITHUB_WORKSPACE/files"
          else
            echo "::error::Cannot find files/ directory."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type d \
              -not -path '*/.git*' -not -path '*/.github*' | sort
            exit 1
          fi

          echo "Source directory:"
          echo "$SRC"

          # ------------------------------------------------------------
          # Check required files
          # ------------------------------------------------------------

          REQUIRED_FILES=(
            "etc/config/picoclaw"
            "etc/init.d/picoclaw-webui"
            "usr/libexec/picoclaw-launcher-placeholder"
            "usr/lib/lua/luci/picoclaw.lua"
            "usr/lib/lua/luci/controller/picoclaw.lua"
            "usr/lib/lua/luci/model/cbi/picoclaw_config.lua"
            "usr/lib/lua/luci/view/picoclaw/status.htm"
            "usr/lib/lua/luci/view/picoclaw/logs.htm"
            "usr/share/rpcd/ucode/luci.picoclaw.uc"
            "usr/share/rpcd/acl.d/40-picoclaw.json"
          )

          MISSING=0

          echo ""
          echo "===== Check required files ====="

          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$SRC/$f" ]; then
              echo "[OK] $f"
            else
              echo "::error::Missing file: $SRC/$f"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "===== Actual source files ====="
            find "$SRC" -type f | sort
            exit 1
          fi

          # ------------------------------------------------------------
          # Prepare package directory
          # ------------------------------------------------------------

          rm -rf "$WORK" "$OUT"

          mkdir -p \
            "$WORK/control" \
            "$WORK/data" \
            "$OUT"

          # Copy all package payload files.
          cp -a "$SRC/." "$WORK/data/"

          # OpenWrt init scripts and the fallback launcher must be executable.
          chmod 0755 "$WORK/data/etc/init.d/picoclaw-webui"
          chmod 0755 "$WORK/data/usr/libexec/picoclaw-launcher-placeholder"

          # ------------------------------------------------------------
          # Create control metadata
          # ------------------------------------------------------------

          cat > "$WORK/control/control" <<EOF
          Package: ${PKG}
          Version: ${VERSION}-${RELEASE}
          Architecture: all
          Maintainer: picoclaw maintainers <noreply@example.invalid>
          Section: luci
          Category: LuCI
          Priority: optional
          License: Apache-2.0
          Depends: luci-base, luci-lua-runtime, luci-compat, rpcd, rpcd-mod-ucode
          Description: LuCI web interface for picoclaw-webui
           Live status, start / stop / restart, autostart toggle and a logs
           viewer for the picoclaw launcher at /opt/picoclaw/picoclaw-launcher
           (default port 18800); this package does not install anything into
           /opt, a bundled fallback launcher is used until the real one is
           present. All actions are validated against a literal whitelist; no
           arbitrary command execution is exposed.
          EOF

          # Remove indentation introduced by the heredoc.
          sed -i 's/^[[:space:]]*//' "$WORK/control/control"

          # Preserve UCI configuration during package upgrades/removal.
          printf '%s\n' \
            '/etc/config/picoclaw' \
            > "$WORK/control/conffiles"

          # ------------------------------------------------------------
          # Maintainer scripts
          #
          # opkg only runs a postinst when the IPK ships one; without it the
          # freshly installed rpcd ucode plugin is not loaded and the LuCI
          # menu stays cached, so the Status page would keep reporting an
          # unregistered `luci.picoclaw` object until the next reboot.
          # Mirrors the Makefile's postinst and luci.mk's default postinst.
          # ------------------------------------------------------------

          cat > "$WORK/control/postinst" <<'EOF'
          #!/bin/sh
          [ -n "${IPKG_INSTROOT}" ] || {
              rm -f /tmp/luci-indexcache.*
              rm -rf /tmp/luci-modulecache/
              /etc/init.d/rpcd reload >/dev/null 2>&1
          }
          exit 0
          EOF
          sed -i 's/^[[:space:]]*//' "$WORK/control/postinst"
          chmod 0755 "$WORK/control/postinst"

          cat > "$WORK/control/prerm" <<'EOF'
          #!/bin/sh
          [ -n "${IPKG_INSTROOT}" ] || {
              /etc/init.d/picoclaw-webui stop >/dev/null 2>&1
              /etc/init.d/picoclaw-webui disable >/dev/null 2>&1
          }
          exit 0
          EOF
          sed -i 's/^[[:space:]]*//' "$WORK/control/prerm"
          chmod 0755 "$WORK/control/prerm"

          # ------------------------------------------------------------
          # Calculate installed size
          # ------------------------------------------------------------

          INSTALLED_SIZE=$(du -sk "$WORK/data" | awk '{print $1}')

          echo "Installed size: ${INSTALLED_SIZE} KB"

          printf '%s\n' \
            "Installed-Size: ${INSTALLED_SIZE}" \
            >> "$WORK/control/control"

          # ------------------------------------------------------------
          # Create control.tar.gz
          # ------------------------------------------------------------

          echo ""
          echo "===== Create control.tar.gz ====="

          (
            cd "$WORK/control"

            tar \
              --format=gnu \
              --numeric-owner \
              --owner=0 \
              --group=0 \
              --sort=name \
              -czf "$WORK/control.tar.gz" \
              .
          )

          # ------------------------------------------------------------
          # Create data.tar.gz
          # ------------------------------------------------------------

          echo "===== Create data.tar.gz ====="

          (
            cd "$WORK/data"

            tar \
              --format=gnu \
              --numeric-owner \
              --owner=0 \
              --group=0 \
              --sort=name \
              -czf "$WORK/data.tar.gz" \
              .
          )

          # Validate gzip archives.
          gzip -t "$WORK/control.tar.gz"
          gzip -t "$WORK/data.tar.gz"

          # ------------------------------------------------------------
          # Create debian-binary
          # ------------------------------------------------------------

          printf '2.0\n' > "$WORK/debian-binary"

          # ------------------------------------------------------------
          # Create OpenWrt IPK
          #
          # OpenWrt IPK format is NOT an ar archive. It is:
          #
          #   gzip( tar( ./debian-binary ./data.tar.gz ./control.tar.gz ) )
          #
          # ------------------------------------------------------------

          echo "===== Create IPK ====="

          (
            cd "$WORK"

            tar \
              --format=gnu \
              --numeric-owner \
              --owner=0 \
              --group=0 \
              --sort=name \
              -czf "$IPK" \
              ./debian-binary \
              ./data.tar.gz \
              ./control.tar.gz
          )

          # ------------------------------------------------------------
          # Validate outer IPK
          # ------------------------------------------------------------

          echo ""
          echo "===== Validate IPK ====="

          test -s "$IPK"

          echo "File type:"
          file "$IPK"

          echo ""
          echo "IPK size:"
          ls -lh "$IPK"

          echo ""
          echo "Outer archive contents:"

          tar -tzf "$IPK"

          # Verify required outer members exist.
          tar -tzf "$IPK" | grep -Fxq "./debian-binary"
          tar -tzf "$IPK" | grep -Fxq "./data.tar.gz"
          tar -tzf "$IPK" | grep -Fxq "./control.tar.gz"

          # ------------------------------------------------------------
          # Extract outer IPK and validate its components
          # ------------------------------------------------------------

          VERIFY="$WORK/verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"

          tar -xzf "$IPK" -C "$VERIFY"

          # Verify debian-binary contents.
          test "$(tr -d '\r\n' < "$VERIFY/debian-binary")" = "2.0"

          # Verify inner gzip files.
          gzip -t "$VERIFY/control.tar.gz"
          gzip -t "$VERIFY/data.tar.gz"

          # ------------------------------------------------------------
          # Validate control archive
          # ------------------------------------------------------------

          mkdir -p "$VERIFY/control"

          tar \
            -xzf "$VERIFY/control.tar.gz" \
            -C "$VERIFY/control"

          echo ""
          echo "===== Control metadata ====="

          cat "$VERIFY/control/control"

          echo ""

          grep -Fxq "Package: ${PKG}" \
            "$VERIFY/control/control"

          grep -Fxq "Version: ${VERSION}-${RELEASE}" \
            "$VERIFY/control/control"

          grep -Fxq "Architecture: all" \
            "$VERIFY/control/control"

          grep -Fxq "/etc/config/picoclaw" \
            "$VERIFY/control/conffiles"

          # ------------------------------------------------------------
          # Validate data archive
          # ------------------------------------------------------------

          mkdir -p "$VERIFY/data"

          tar \
            -xzf "$VERIFY/data.tar.gz" \
            -C "$VERIFY/data"

          echo ""
          echo "===== Validate installed files ====="

          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$VERIFY/data/$f" ]; then
              echo "[OK] $f"
            else
              echo "::error::Missing packaged file: $f"
              exit 1
            fi
          done

          # Verify executable modes on scripts.
          for s in \
            "$VERIFY/data/etc/init.d/picoclaw-webui" \
            "$VERIFY/data/usr/libexec/picoclaw-launcher-placeholder"; do
            mode=$(stat -c '%a' "$s")
            echo "  $(basename "$s") mode: $mode"
            test "$mode" = "755"
          done

          # ------------------------------------------------------------
          # Final information
          # ------------------------------------------------------------

          echo ""
          echo "======================================"
          echo "IPK BUILD SUCCESSFUL"
          echo "======================================"

          echo ""
          echo "Output file:"
          echo "$IPK"

          echo ""
          echo "File information:"
          file "$IPK"

          echo ""
          echo "Archive contents:"
          tar -tzf "$IPK"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-picoclaw-all-ipk
          path: dist/luci-app-picoclaw_1.0.0-11_all.ipk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # Aggregate: on tag push, attach the IPK to a GitHub Release.
  # ---------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download IPK artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-picoclaw-all-ipk
          path: dist

      - name: List collected artifacts
        run: |
          echo "Collected IPKs:"
          find dist -type f -name '*.ipk' -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.ipk